name: Test and security verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install -e ".[api,dev]"
      - name: Compile
        run: python -m compileall -q agents plasmid_check sequence_verification.py
      - name: Python tests
        run: python -m pytest -q
      - name: Browser logic tests
        run: node --test web/tests/sequence.test.cjs
      - name: Audit integrity regression
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
