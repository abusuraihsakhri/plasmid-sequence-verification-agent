version: '3.8'

services:
  plasmid-sequence-verification-engine:
    build: .
    container_name: plasmid-sequence-verification-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - MODEL_PROVIDER=mock
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
