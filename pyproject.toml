[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-sequence-verification-engine"
version = "2.0.0"
description = "PlasmidCheck: NGS / Sanger Recombinant DNA Assembly Verification Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
plasmid-sequence-verification-engine = "plasmid_check.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/plasmid-sequence-verification-engine"
Repository = "https://github.com/abusuraihsakhri/plasmid-sequence-verification-engine.git"
