[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-sequence-verification-engine"
version = "2.0.0"
description = "PlasmidCheck: NGS / Sanger Recombinant DNA Assembly Verification Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
plasmid-sequence-verification-engine = "plasmid_check.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/plasmid-sequence-verification-agent"
Repository = "https://github.com/abusuraihsakhri/plasmid-sequence-verification-agent.git"

[tool.setuptools]
packages = ["agents", "plasmid_check"]
py-modules = ["sequence_verification"]
